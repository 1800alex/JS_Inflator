name: macOS Build

on:
  workflow_dispatch:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main]

env:
  build-dir: build
  build-type: Release

jobs:
  build-apple-silicon:
    name: Build for macOS (Apple Silicon arm64)
    runs-on: macos-14 # Apple Silicon (M1/M2) runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          brew install cmake pkg-config

      - name: Configure CMake
        run: |
          cmake -B ${{ env.build-dir }} \
            -DCMAKE_BUILD_TYPE=${{ env.build-type }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFETCHCONTENT_QUIET=OFF

      - name: Build
        run: |
          cmake --build ${{ env.build-dir }} --config ${{ env.build-type }} --parallel $(sysctl -n hw.ncpu)

      - name: Show build artifacts
        run: |
          find ${{ env.build-dir }} -name "*.vst3" -type d

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos-arm64-${{ github.sha }}
          path: ${{ env.build-dir }}/VST3/Release/JS_Inflator.vst3/

  build-universal:
    name: Build Universal Binary (Intel + Apple Silicon)
    runs-on: macos-14 # Apple Silicon runner (can cross-compile)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          brew install cmake pkg-config

      - name: Configure CMake
        run: |
          cmake -B ${{ env.build-dir }} \
            -DCMAKE_BUILD_TYPE=${{ env.build-type }} \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DFETCHCONTENT_QUIET=OFF

      - name: Build
        run: |
          cmake --build ${{ env.build-dir }} --config ${{ env.build-type }} --parallel $(sysctl -n hw.ncpu)

      - name: Verify Universal Binary
        run: |
          find ${{ env.build-dir }}/VST3/Release/JS_Inflator.vst3 -name "*.dylib" -o -name "JS_Inflator" -type f | while read file; do
            echo "Checking architectures in: $file"
            lipo -info "$file" || file "$file"
          done

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macos-universal-${{ github.sha }}
          path: ${{ env.build-dir }}/VST3/Release/JS_Inflator.vst3/
